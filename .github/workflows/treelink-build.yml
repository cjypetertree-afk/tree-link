name: TREE LINK Build & Installers

on:
  push:
    branches: [main, dev/remote-desktop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release with macOS .dmg and Windows .msi installers
        type: boolean
        default: false
      release_tag:
        description: Release tag name (when publish_release is true)
        type: string
        default: v0.3.7-treelink.3

permissions:
  contents: write

concurrency:
  group: treelink-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  MACOSX_DEPLOYMENT_TARGET: '14.2'
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  npm_config_engine_strict: 'false'
  PYTHONUTF8: '1'
  DOTNET_ROLL_FORWARD: 'Major'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies & verify frontend
        run: |
          npm ci
          npm run -w apps/oink typecheck
          npm run -w apps/oink test
          npm run -w apps/oink build

  package-macos:
    needs: frontend
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: treelink-macos-arm64
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Test & lint treelink-screen
        run: |
          cargo test -p treelink-screen --target aarch64-apple-darwin
          cargo clippy -p treelink-screen --all-targets --target aarch64-apple-darwin -- -D warnings
      - name: Build TREE LINK macOS .dmg installer
        run: python3 scripts/package-macos.py --arch arm64 --output-dir dist-packages --build-label "${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: TREE-LINK-macos-arm64-dmg
          path: |
            dist-packages/TREE-LINK-*-macos-arm64.dmg
            dist-packages/SHA256SUMS-macos-arm64.txt
          if-no-files-found: error

  package-windows:
    needs: frontend
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: treelink-windows-x64
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm ci
      - name: Test & lint treelink-screen
        run: |
          cargo test -p treelink-screen --target x86_64-pc-windows-msvc
          cargo clippy -p treelink-screen --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Build TREE LINK Windows x64 .msi installer
        run: python scripts/package-windows.py --output-dir dist-packages --sequence "${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: TREE-LINK-windows-x64-msi
          path: |
            dist-packages/TREE-LINK-*-windows-x64.msi
            dist-packages/SHA256SUMS-windows-x64.txt
          if-no-files-found: error

  release:
    needs: [package-macos, package-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Combine SHA256SUMS and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          cat release-assets/SHA256SUMS-*.txt > release-assets/SHA256SUMS.txt
          rm -f release-assets/SHA256SUMS-*.txt
          ls -la release-assets
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GH_REPO" \
              --title "TREE LINK $TAG" \
              --notes "## TREE LINK 安装包 (Q版小树图标 · 默认实时控屏 · 单机/双机自由切换)

          - **macOS (Apple Silicon)**: 下载 \`TREE-LINK-0.3.7-macos-arm64.dmg\`，或运行一行自动安装/更新：
            \`\`\`bash
            curl -fsSL https://raw.githubusercontent.com/cjypetertree-afk/tree-link/main/scripts/install-mac.sh | bash
            \`\`\`
          - **Windows 10/11 (64位)**: 下载 \`TREE-LINK-0.3.7-windows-x64.msi\`，或 PowerShell 运行一行自动安装/更新：
            \`\`\`powershell
            irm https://raw.githubusercontent.com/cjypetertree-afk/tree-link/main/scripts/install-windows.ps1 | iex
            \`\`\`

          ### 核心特性
          - 打开默认进入 **TREE LINK 实时控屏** 主界面，单台专注 / 双台同屏独立自由切换
          - 全新 Q 版小树图标与全界面 TREE LINK 品牌化（保留完整 GPL-3.0 衍生许可与归属声明）
          - 零延迟本地光标模式 + 250Hz 二进制鼠键操控 + 60fps 硬件 H.264/HEVC
          - 完整保留跨机键鼠 KVM、拖拽传文件、剪贴板同步与低延迟音频" \
              --latest
          fi
