[package]
name = "treelink-screen"
description = "TREE LINK real-time remote desktop capture, hardware encoding, network ranking, and remote window input injection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
oink-foundation.workspace = true
oink-display.workspace = true
oink-input.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64 = "0.22"
bytes = "1"
if-addrs = "0.13"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
constant_time_eq = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "treelink-screen-host"
path = "src/bin/treelink_screen_host.rs"

[lints]
workspace = true
